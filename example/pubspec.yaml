name: nepal_admin_api_example
description: >-
  Compile-checked example assets for nepal_admin_api. Not an app — just the
  files a consumer copies into their own project, kept honest by CI.
publish_to: none

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  nepal_admin_api:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true