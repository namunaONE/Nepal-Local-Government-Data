name: nepal_admin_widgets
description: >-
  Flutter dropdowns for Nepal's administrative divisions — 7 provinces,
  77 districts, 753 local bodies. Bilingual (English + Devanagari), offline,
  and backed by the verified nepal_admin_api dataset.
version: 0.1.0

homepage: https://github.com/namunaONE/Nepal-Local-Government-Data/tree/main/packages/nepal_admin_widgets
repository: https://github.com/namunaONE/Nepal-Local-Government-Data
issue_tracker: https://github.com/namunaONE/Nepal-Local-Government-Data/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Released against nepal_admin_api ^2.7.2 (verified by CI).
  nepal_admin_api: ^2.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

