name: Dart CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting (generated file excluded)
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v 'lib/src/nepal_data.dart')
      - name: Regenerate dataset (validates JSON against official counts)
        run: dart run tool/generate.dart
      - name: Verify no codegen drift
        run: git diff --exit-code -- lib/src/nepal_data.dart
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Run tests
        run: dart test

  publish-dry-run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Publish dry-run (no upload)
        run: dart pub publish --dry-run
