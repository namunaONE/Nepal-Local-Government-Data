name: Dart CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly provenance watch: catches upstream source drift before a merge run
    # does, instead of after.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting (generated file excluded)
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v 'lib/src/nepal_data.dart')
      - name: Regenerate dataset (validates JSON against official counts)
        run: dart run tool/generate.dart
      - name: Verify no codegen drift
        run: git diff --exit-code -- lib/src/nepal_data.dart
      - name: Regenerate website payload
        run: dart run tool/generate_explorer_data.dart
      - name: Verify no website data drift (docs must match the package)
        run: git diff --exit-code -- docs/data.json
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Run tests
        run: dart test
      - name: Coverage report
        run: dart test --coverage=coverage && dart pub global activate coverage && dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Explorer smoke test (no browser, no npm deps)
        run: node docs/smoke.cjs

  # example/brand_theme.dart imports package:flutter/material.dart, so plain
  # `dart analyze` excludes it. Without this job it is the only Dart file in the
  # repo that nothing ever compiles, and it would rot silently.
  flutter-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
      - name: Compile-check the Flutter example
        run: dart analyze --fatal-infos example/brand_theme.dart

  # Scheduled integrity watch: re-hashes every vendored input against the
  # provenance manifest and files an issue when an upstream source changes,
  # so a silent upstream drift cannot sit unnoticed until a merge run fails.
  provenance-watch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Verify provenance of every vendored input
        id: provenance
        continue-on-error: true
        run: dart run tool/merge/verify_codes.dart
      - name: File an issue when upstream drifted
        if: steps.provenance.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = 'The scheduled provenance check failed: at least one '
              + 'vendored input in `data/_raw/` no longer matches its SHA-256 '
              + 'pin in `data/PROVENANCE.sha256`, or is missing.\n\n'
              + 'An upstream source has changed. Do NOT re-run the merge to '
              + 'paper over it — follow the guidance in `data/SOURCES.md` '
              + '(re-fetch, re-review, re-pin, then re-merge).\n\n'
              + 'See the failing run logs for the specific file.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[provenance] vendored source drift detected',
              body,
              labels: ['data'],
            });

  publish-dry-run:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Publish dry-run (no upload)
        run: dart pub publish --dry-run

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4